# ==============================================================================
# StockSense AI - Render Blueprint Deployment Specification
# ==============================================================================

services:
  - type: web
    name: stocksense-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

databases:
  - name: stocksense-db
    plan: free
    region: oregon
    databaseName: stocksense
    user: stocksense_user
